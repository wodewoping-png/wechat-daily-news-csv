name: periodic-summary

on:
  workflow_run:
    workflows: [channel-monitor]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      period:
        description: "Summary period to generate"
        required: false
        type: choice
        options:
          - week
          - month
          - both
        default: both
      week:
        description: "Weekly target: last-week, this-week, or YYYY-MM-DD"
        required: false
        default: last-week
      month:
        description: "Monthly target: last-month, this-month, or YYYY-MM"
        required: false
        default: last-month
  push:
    branches: [main]
    paths:
      - ".github/workflows/periodic-summary.yml"
      - "scripts/reconcile_weekly_summaries.py"
      - "tests/test_weekly_reconciliation.py"
      - "config/industry_*.json"
      - "scripts/classify_wechat_news.py"
      - "scripts/zai_industry_client.py"
      - "tests/test_industry_classification.py"
      - ".github/workflows/industry-classification.yml"
  schedule:
    # Beijing time: Monday-Wednesday 14:23, after the previous day's CSV
    # normally lands in this repository. Tuesday/Wednesday retry late uploads.
    # The first day of each month at 08:50 generates the monthly summary.
    - cron: "23 6 * * 1-3"
    - cron: "50 0 1 * *"

permissions:
  contents: write

concurrency:
  group: periodic-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install openpyxl==3.1.5

      - name: Test summary generator
        run: python -m unittest discover -s tests -v

      - name: Generate periodic summaries
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PERIOD: ${{ github.event.inputs.period || 'both' }}
          INPUT_WEEK: ${{ github.event.inputs.week || 'last-week' }}
          INPUT_MONTH: ${{ github.event.inputs.month || 'last-month' }}
        shell: bash
        run: |
          set -euo pipefail
          period="$INPUT_PERIOD"
          # Daily CSV publication, late arrivals and repairs reconcile every
          # completed week with all seven source files. No AI call gates export.
          python scripts/reconcile_weekly_summaries.py
          if [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "23 6 * * 1-3") exit 0 ;;
              "50 0 1 * *") period="month" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
            esac
          fi
          python scripts/generate_periodic_summary.py \
            --period "$period" \
            --week "$INPUT_WEEK" \
            --month "$INPUT_MONTH"

      - name: Commit summaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A csv/weekly csv/monthly reports/weekly reports/monthly classified/weekly quality/weekly_summary_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: reconcile available weekly wechat summaries'
          git pull --rebase origin main
          git push origin HEAD:main
