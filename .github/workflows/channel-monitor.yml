name: channel-monitor

on:
  workflow_dispatch:
    inputs:
      date:
        description: "已入库的发文日期 YYYY-MM-DD，默认latest最新已入库日期"
        default: latest
        required: false
      force_dingtalk:
        description: "强制重发钉钉日报（仅人工需要重新发送时勾选）"
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - "csv/*.csv"
      - "channels/seed_accounts.csv"
      - "channels/monitor_config.json"
      - "quality/channel_fetch_events/*.jsonl"
      - "scripts/monitor_channels.py"
      - "scripts/notify_channel_monitor.py"
      - "scripts/notify_dingtalk.py"
      - "scripts/select_channel_monitor_input.py"
      - "tests/test_monitor_channels.py"
      - "tests/test_notify_dingtalk.py"
      - "tests/test_channel_monitor_input.py"
      - ".github/workflows/channel-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  # Share the existing summary workflow's lock because both publish to main.
  group: periodic-summary
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test channel monitor
        run: python -m unittest discover -s tests -p 'test_monitor_channels.py' -v
      - name: Test DingTalk notification
        run: python -m unittest discover -s tests -p 'test_notify_dingtalk.py' -v
      - name: Test CSV publication event selection
        run: python -m unittest discover -s tests -p 'test_channel_monitor_input.py' -v
      - name: Select published daily CSV
        id: source
        run: python scripts/select_channel_monitor_input.py
      - name: Update inventory and daily monitoring
        id: monitor
        if: steps.source.outputs.monitor == 'true'
        env:
          TARGET_DATE: ${{ steps.source.outputs.date }}
        run: python scripts/monitor_channels.py --date "$TARGET_DATE"
      - name: Maintain channel matrix without notifications
        if: steps.source.outputs.monitor == 'false'
        run: python scripts/monitor_channels.py --date latest --matrix-only
      - name: Publish reports and history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels quality/channel_monitor
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update channel inventory and daily monitoring'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Show monitoring report
        if: steps.monitor.outcome == 'success'
        run: cat quality/channel_monitor/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Send daily channel report to DingTalk
        id: dingtalk
        if: ${{ !cancelled() && steps.monitor.outcome == 'success' }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD || 'wechat' }}
          DINGTALK_FORCE: ${{ github.event.inputs.force_dingtalk || 'false' }}
        run: python scripts/notify_dingtalk.py
      - name: Persist acknowledged DingTalk deliveries
        if: ${{ !cancelled() && steps.monitor.outcome == 'success' && steps.dingtalk.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=quality/channel_monitor/dingtalk_delivery_state.json
          if [ -f "$receipt" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$receipt"
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record acknowledged DingTalk notifications'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Maintain current incidents issue
        if: ${{ !cancelled() && steps.monitor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify_channel_monitor.py
      - name: Mark confirmed failures and unavailable feed
        if: ${{ !cancelled() && steps.monitor.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('quality/channel_monitor/latest_alerts.json').read_text(encoding='utf-8'))
          confirmed = [a for a in p['alerts'] if a['rule'] in {'daily_feed_unavailable', 'fetch_error', 'not_configured'}]
          for a in p['alerts']:
              print('::warning::Channel monitoring signal: ' + a['rule'])
          if confirmed:
              raise SystemExit('Confirmed collection failure or unavailable daily feed. See monitoring report and managed issue.')
          PY
